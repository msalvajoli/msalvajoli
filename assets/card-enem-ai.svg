<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="ENEM AI">
  <title>ENEM AI</title>
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#00E5FF" stop-opacity=".1"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="gl" cx="85%" cy="0%" r="70%">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#00E5FF" stroke-opacity=".05"/></pattern>
    <filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,'Liberation Mono','Courier New',monospace; }
    .trace { stroke-dasharray: 120 1640; animation: trace 6s linear infinite; }
    @keyframes trace { to { stroke-dashoffset: -1760; } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .redact { animation: redact 3s steps(1) infinite; }
    @keyframes redact { 0%,90%,100% { opacity: 1; } 92% { opacity: .3; } 94% { opacity: 1; } 96% { opacity: .5; } }
  </style>
  <rect x="6" y="6" width="588" height="288" rx="16" fill="#070B14"/>
  <rect x="6" y="6" width="588" height="288" rx="16" fill="url(#grid)"/>
  <rect x="6" y="6" width="588" height="288" rx="16" fill="url(#gl)"/>
  <rect x="6.5" y="6.5" width="587" height="287" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
  <rect x="6.5" y="6.5" width="587" height="287" rx="16" fill="none" stroke="#00E5FF" stroke-width="2.5" class="trace" filter="url(#g)"/>

  <text x="34" y="46" font-size="12" fill="#00E5FF" letter-spacing="3">PROJETO_01</text>
  <rect x="438" y="28" width="128" height="26" rx="13" fill="#FFB300" fill-opacity=".1" stroke="#FFB300" stroke-opacity=".6"/>
  <circle cx="454" cy="41" r="4" fill="#FFB300" class="pulse"/>
  <text x="466" y="45.5" font-size="12" fill="#FFB300" letter-spacing="1.5">EM DEPLOY</text>

  <g transform="translate(34 70)" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#g)"><path d="M14 8a6 6 0 0 0-6 6 6 6 0 0 0-2 11 6 6 0 0 0 8 7h0V8Z M26 8a6 6 0 0 1 6 6 6 6 0 0 1 2 11 6 6 0 0 1-8 7V8Z M20 8v24" /></g>
  <text x="88" y="101" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="1">ENEM AI</text>

  <text x="34" y="150" font-size="15" fill="#8B98A9"><tspan x="34" dy="0">Plataforma SaaS de preparação para o ENEM</tspan><tspan x="34" dy="24">com IA generativa e pagamentos integrados.</tspan></text>
  <rect x="34" y="218" width="100" height="26" rx="13" fill="#00E5FF" fill-opacity=".08" stroke="#00E5FF" stroke-opacity=".45"/><text x="84" y="235.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">Next.js 14</text><rect x="142" y="218" width="100" height="26" rx="13" fill="#00E5FF" fill-opacity=".08" stroke="#00E5FF" stroke-opacity=".45"/><text x="192" y="235.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">TypeScript</text><rect x="250" y="218" width="84" height="26" rx="13" fill="#00E5FF" fill-opacity=".08" stroke="#00E5FF" stroke-opacity=".45"/><text x="292" y="235.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">Supabase</text><rect x="342" y="218" width="68" height="26" rx="13" fill="#00E5FF" fill-opacity=".08" stroke="#00E5FF" stroke-opacity=".45"/><text x="376" y="235.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">OpenAI</text><rect x="418" y="218" width="68" height="26" rx="13" fill="#00E5FF" fill-opacity=".08" stroke="#00E5FF" stroke-opacity=".45"/><text x="452" y="235.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">Stripe</text>
  <text x="566" y="270" text-anchor="end" font-size="12" fill="#00E5FF" letter-spacing="2">ACESSAR →</text>
