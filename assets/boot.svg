<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="M.A.T.H.E.U.S Neural Interface — sistema inicializando">
  <title>M.A.T.H.E.U.S // Neural Interface</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00E5FF" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#00E5FF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="#9CF6FF"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity=".15"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset=".6" stop-color="#05070D" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070D" stop-opacity=".9"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset=".55" stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="460" rx="18"/></clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,'Liberation Mono','Courier New',monospace; }
    .spin, .spinR, .spinS, .pulse, .ln, .title, .gl, .bar, .fadeOut, .fadeIn { transform-box: fill-box; transform-origin: center; }

    /* power-on flicker */
    .power { animation: power 1s ease-out both; }
    @keyframes power { 0%{opacity:0} 10%{opacity:.8} 14%{opacity:.1} 22%{opacity:.9} 26%{opacity:.3} 40%,100%{opacity:1} }

    /* arc reactor */
    .spin  { animation: spin 18s linear infinite; }
    .spinR { animation: spin 11s linear infinite reverse; }
    .spinS { animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:.95} 50%{transform:scale(1.12);opacity:.7} }
    .ring-in { animation: ringIn 1.4s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin:center; }
    @keyframes ringIn { from{opacity:0;transform:scale(.4) rotate(-90deg)} to{opacity:1;transform:none} }

    /* boot log lines */
    .ln { opacity:0; animation: lineIn .4s ease-out forwards; transform-origin: left center; }
    @keyframes lineIn { from{opacity:0;transform:translateX(-12px)} to{opacity:1;transform:none} }
    .d1{animation-delay:.5s} .d2{animation-delay:1s} .d3{animation-delay:1.5s} .d4{animation-delay:2s} .d5{animation-delay:2.5s}
    .d6{animation-delay:3.1s} .d7{animation-delay:3.4s}

    /* title + glitch */
    .title { opacity:0; animation: titleIn .7s cubic-bezier(.2,.8,.2,1) 3.1s forwards; }
    @keyframes titleIn { 0%{opacity:0;transform:scale(1.08);letter-spacing:30px} 60%{opacity:1} 100%{opacity:1;transform:none} }
    .gl { opacity:0; animation: glitch 4s steps(1) 3.8s infinite; }
    .gl2 { animation-delay: 3.85s; }
    @keyframes glitch {
      0%,88%,100% { opacity:0; transform:none; }
      89% { opacity:.85; transform: translate(-6px,1px); }
      91% { opacity:.85; transform: translate(5px,-2px); }
      93% { opacity:.6;  transform: translate(-2px,0); }
      95% { opacity:0; }
    }

    /* progress bar */
    .bar { transform-origin: left center; transform: scaleX(0); animation: load 2.9s cubic-bezier(.6,.05,.3,1) .3s forwards; }
    @keyframes load { 0%{transform:scaleX(0)} 40%{transform:scaleX(.46)} 55%{transform:scaleX(.52)} 100%{transform:scaleX(1)} }
    .fadeOut { animation: fadeOut .2s linear 3.2s forwards; }
    @keyframes fadeOut { to { opacity:0; } }
    .fadeIn { opacity:0; animation: fadeIn .3s linear 3.3s forwards; }
    @keyframes fadeIn { to { opacity:1; } }

    /* ambience */
    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from{transform:translateY(-40px)} to{transform:translateY(500px)} }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    .breathe { animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.35} 50%{opacity:1} }
  </style>

  <g clip-path="url(#frame)">
    <!-- base -->
    <rect width="1200" height="460" fill="#05070D"/>
    <rect width="1200" height="460" fill="url(#grid)"/>
    <circle cx="230" cy="240" r="260" fill="url(#reactorGlow)"/>
    <ellipse cx="900" cy="300" rx="380" ry="160" fill="#FF2BD6" opacity=".05" filter="url(#softGlow)"/>

    <g class="power">
      <!-- HUD frame -->
      <g fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="square">
        <path d="M22 62V22H62"/><path d="M1138 22H1178V62"/>
        <path d="M22 398V438H62"/><path d="M1178 398V438H1138"/>
      </g>
      <g fill="none" stroke="#00E5FF" stroke-opacity=".25">
        <path d="M80 22H560"/><path d="M640 438H1120"/>
      </g>

      <!-- top status bar -->
      <text x="42" y="50" font-size="12" fill="#00E5FF" fill-opacity=".7" letter-spacing="2">SYS://SALVAJOLI.OS  ·  OPERADOR MATHEUS  ·  BUILD 2026.10  ·  NODE BR-SP  ·  UPLINK 98.7%</text>
      <circle cx="1048" cy="46" r="4" fill="#39FF88" class="breathe"/>
      <text x="1060" y="50" font-size="12" fill="#39FF88" letter-spacing="2">ONLINE</text>

      <!-- ARC REACTOR / AI CORE -->
      <g transform="translate(230 240)">
        <g class="ring-in">
          <circle r="172" fill="none" stroke="#00E5FF" stroke-opacity=".35" stroke-width="10" stroke-dasharray="1.2 28.8" class="spin"/>
          <circle r="150" fill="none" stroke="#00E5FF" stroke-opacity=".18" stroke-width="1"/>
          <circle r="136" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="90 18 14 18" class="spinR"/>
          <circle r="114" fill="none" stroke="#FF2BD6" stroke-opacity=".8" stroke-width="1.5" stroke-dasharray="3 9" class="spin"/>
          <circle r="94" fill="none" stroke="#00E5FF" stroke-width="7" stroke-dasharray="44 15" stroke-opacity=".85" class="spinS" filter="url(#glow)"/>
          <circle r="74" fill="none" stroke="#7DF9FF" stroke-opacity=".4" stroke-width="1"/>
          <!-- inner triangle (repulsor) -->
          <path d="M0 -60 L52 30 L-52 30 Z" fill="none" stroke="#00E5FF" stroke-opacity=".55" stroke-width="2" class="spinR"/>
        </g>
        <circle r="44" fill="url(#core)" class="pulse" filter="url(#glow)"/>
        <circle r="18" fill="#FFFFFF" opacity=".95"/>
        <text y="205" text-anchor="middle" font-size="11" fill="#00E5FF" fill-opacity=".6" letter-spacing="4">J.A.R.V.I.S-CLASS CORE</text>
      </g>

      <!-- BOOT LOG -->
      <g font-size="16">
        <text x="450" y="106" class="ln d1" fill="#7DF9FF">&gt; BOOT_SEQUENCE // M.A.T.H.E.U.S NEURAL INTERFACE v4.2</text>
        <text x="450" y="138" class="ln d2"><tspan fill="#39FF88">[  OK  ]</tspan><tspan fill="#C9D1D9"> Núcleo cognitivo ................ </tspan><tspan fill="#00E5FF">ONLINE</tspan></text>
        <text x="450" y="166" class="ln d3"><tspan fill="#39FF88">[  OK  ]</tspan><tspan fill="#C9D1D9"> Módulos produto · design · growth  </tspan><tspan fill="#00E5FF">CARREGADOS</tspan></text>
        <text x="450" y="194" class="ln d4"><tspan fill="#39FF88">[  OK  ]</tspan><tspan fill="#C9D1D9"> Copiloto de IA ................. </tspan><tspan fill="#00E5FF">SINCRONIZADO</tspan></text>
        <text x="450" y="222" class="ln d5"><tspan fill="#39FF88">[  OK  ]</tspan><tspan fill="#C9D1D9"> disciplina.exe .................. </tspan><tspan fill="#FF2BD6">ATIVO</tspan></text>
      </g>

      <!-- TITLE -->
      <g font-size="80" font-weight="800" letter-spacing="14">
        <text x="446" y="318" fill="#FF2BD6" class="gl">MATHEUS</text>
        <text x="446" y="318" fill="#00E5FF" class="gl gl2">MATHEUS</text>
        <g class="title"><text x="446" y="318" fill="url(#titleGrad)" filter="url(#glow)">MATHEUS</text></g>
      </g>
      <text x="450" y="354" font-size="14" fill="#8B98A9" letter-spacing="2.5" class="ln d6">EMPREENDEDOR DIGITAL  ◆  PRODUCT BUILDER  ◆  ORQUESTRADOR DE IA</text>

      <!-- PROGRESS -->
      <rect x="450" y="378" width="640" height="6" rx="3" fill="#0F1A2B"/>
      <rect x="450" y="378" width="640" height="6" rx="3" fill="url(#barGrad)" class="bar" filter="url(#glow)"/>
      <text x="450" y="408" font-size="12" fill="#00E5FF" fill-opacity=".75" letter-spacing="3" class="fadeOut">INICIALIZANDO PERFIL...</text>
      <g class="fadeIn">
        <text x="450" y="408" font-size="12" fill="#39FF88" letter-spacing="3">SISTEMA ONLINE  ·  BEM-VINDO, OPERADOR<tspan class="blink"> █</tspan></text>
      </g>
      <text x="1090" y="408" font-size="12" fill="#8B98A9" letter-spacing="2" text-anchor="end" class="ln d7">100%</text>
    </g>

    <!-- scanline + vignette -->
    <rect x="0" y="0" width="1200" height="40" fill="#00E5FF" opacity=".05" class="scan"/>
    <rect width="1200" height="460" fill="url(#vignette)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="459" rx="18" fill="none" stroke="#00E5FF" stroke-opacity=".25"/>
</svg>
