<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="Fim da transmissão">
  <title>// FIM DA TRANSMISSÃO</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070D"/><stop offset=".46" stop-color="#0B0716"/><stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070D" stop-opacity="1"/><stop offset=".25" stop-color="#05070D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <clipPath id="floor"><rect x="0" y="150" width="1200" height="140"/></clipPath>
    <clipPath id="frame"><rect width="1200" height="290" rx="18"/></clipPath>
    <mask id="sunCut">
      <rect x="500" y="0" width="200" height="150" fill="#fff"/>
      <rect x="500" y="114" width="200" height="3" fill="#000"/><rect x="500" y="126" width="200" height="4" fill="#000"/>
      <rect x="500" y="138" width="200" height="5" fill="#000"/>
    </mask>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,'Liberation Mono','Courier New',monospace; }
    .move { animation: move 1.6s linear infinite; }
    @keyframes move { from { transform: translateY(0); } to { transform: translateY(32px); } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .glowp { animation: gp 3s ease-in-out infinite; }
    @keyframes gp { 0%,100% { opacity: .55; } 50% { opacity: .9; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="290" fill="url(#sky)"/>
    <circle cx="600" cy="150" r="60" fill="url(#sun)" mask="url(#sunCut)" opacity=".85" class="glowp" filter="url(#g)"/>
    <g clip-path="url(#floor)" stroke="#00E5FF" stroke-opacity=".35" stroke-width="1">
      <line x1="192" y1="150" x2="-2520" y2="290"/><line x1="226" y1="150" x2="-2260" y2="290"/><line x1="260" y1="150" x2="-2000" y2="290"/><line x1="294" y1="150" x2="-1740" y2="290"/><line x1="328" y1="150" x2="-1480" y2="290"/><line x1="362" y1="150" x2="-1220" y2="290"/><line x1="396" y1="150" x2="-960" y2="290"/><line x1="430" y1="150" x2="-700" y2="290"/><line x1="464" y1="150" x2="-440" y2="290"/><line x1="498" y1="150" x2="-180" y2="290"/><line x1="532" y1="150" x2="80" y2="290"/><line x1="566" y1="150" x2="340" y2="290"/><line x1="600" y1="150" x2="600" y2="290"/><line x1="634" y1="150" x2="860" y2="290"/><line x1="668" y1="150" x2="1120" y2="290"/><line x1="702" y1="150" x2="1380" y2="290"/><line x1="736" y1="150" x2="1640" y2="290"/><line x1="770" y1="150" x2="1900" y2="290"/><line x1="804" y1="150" x2="2160" y2="290"/><line x1="838" y1="150" x2="2420" y2="290"/><line x1="872" y1="150" x2="2680" y2="290"/><line x1="906" y1="150" x2="2940" y2="290"/><line x1="940" y1="150" x2="3200" y2="290"/><line x1="974" y1="150" x2="3460" y2="290"/><line x1="1008" y1="150" x2="3720" y2="290"/>
      <g class="move"><line x1="0" y1="156" x2="1200" y2="156"/><line x1="0" y1="165" x2="1200" y2="165"/><line x1="0" y1="178" x2="1200" y2="178"/><line x1="0" y1="196" x2="1200" y2="196"/><line x1="0" y1="220" x2="1200" y2="220"/><line x1="0" y1="252" x2="1200" y2="252"/><line x1="0" y1="290" x2="1200" y2="290"/></g>
    </g>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#FF2BD6" stroke-width="2" filter="url(#g)"/>
    <rect width="1200" height="290" fill="url(#fade)"/>
    <text x="600" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="url(#t)" letter-spacing="8">// FIM DA TRANSMISSÃO</text>
    <text x="600" y="72" text-anchor="middle" font-size="15" fill="#C9D1D9" letter-spacing="1">“O futuro não é algo que se espera. É algo que se constrói.”<tspan fill="#FF2BD6"> — MTH</tspan></text>
    <text x="600" y="264" text-anchor="middle" font-size="13" fill="#C9D1D9" letter-spacing="3">CONSTRUÍDO COM DISCIPLINA &amp; IA  ·  BRASIL  ·  © 2026 MTH<tspan fill="#00E5FF" class="blink"> █</tspan></text>
  </g>
  <rect x=".5" y=".5" width="1199" height="289" rx="18" fill="none" stroke="#00E5FF" stroke-opacity=".2"/>
</svg>
