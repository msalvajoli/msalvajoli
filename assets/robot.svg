<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Unidade S-01: robô patrulhando o perfil">
  <title>UNIDADE S-01 // PATRULHA ATIVA</title>
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset=".2" stop-color="#00E5FF" stop-opacity=".7"/>
      <stop offset=".8" stop-color="#FF2BD6" stop-opacity=".7"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16243A"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".4" stop-color="#FF2BD6"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00E5FF" stroke-opacity=".05"/></pattern>
