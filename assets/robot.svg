  <g clip-path="url(#frame)">
    <rect width="1200" height="190" fill="#05070D"/>
    <rect width="1200" height="190" fill="url(#grid)"/>
    <text x="28" y="182" font-size="11" fill="#00E5FF" fill-opacity=".7" letter-spacing="3">UNIDADE S-01 · PATRULHA ATIVA</text>
    <circle cx="1146" cy="178" r="4" fill="#39FF88" class="pulse"/>
    <text x="1172" y="182" text-anchor="end" font-size="11" fill="#39FF88" letter-spacing="2">ON</text>
    <rect x="0" y="163" width="1200" height="2" fill="url(#floor)"/>
    <rect x="0" y="166" width="1200" height="24" fill="#00E5FF" opacity=".025"/>

    <g transform="translate(0 163)">
      <g class="patrol">
        <!-- sombra -->
        <ellipse cx="0" cy="2" rx="30" ry="5" fill="#00E5FF" opacity=".18"/>
        <g class="holo">
          <!-- pernas -->
          <g class="limb legB"><rect x="4" y="-34" width="7" height="30" rx="3.5" fill="#24324A"/><rect x="1" y="-6" width="15" height="6" rx="3" fill="#00E5FF" fill-opacity=".8"/></g>
          <g class="bob">
            <!-- braço de trás -->
            <g class="limb armL"><rect x="-31" y="-74" width="6" height="28" rx="3" fill="#24324A" stroke="#00E5FF" stroke-opacity=".5"/><circle cx="-28" cy="-45" r="4.5" fill="#00E5FF" fill-opacity=".7"/></g>
            <!-- corpo -->
            <rect x="-25" y="-78" width="50" height="44" rx="14" fill="url(#shell)" stroke="#00E5FF" stroke-width="1.6"/>
            <path d="M-15 -42H15" stroke="#00E5FF" stroke-opacity=".35"/>
            <circle cx="0" cy="-58" r="10" fill="url(#core)" class="pulse"/>
            <circle cx="0" cy="-58" r="3.5" fill="#FFFFFF"/>
            <!-- cabeça -->
            <rect x="-32" y="-124" width="64" height="44" rx="20" fill="url(#shell)" stroke="#00E5FF" stroke-width="1.8"/>
            <rect x="-24" y="-114" width="48" height="24" rx="12" fill="#00121C" stroke="#00E5FF" stroke-opacity=".6"/>
            <g class="eyesN" filter="url(#g)">
              <rect x="-14" y="-108" width="8" height="12" rx="4" fill="#00E5FF" class="blink"/>
              <rect x="6" y="-108" width="8" height="12" rx="4" fill="#00E5FF" class="blink"/>
            </g>
            <g class="eyesH" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" filter="url(#g)">
              <path d="M-15 -99q5 -7 10 0"/><path d="M5 -99q5 -7 10 0"/>
            </g>
            <rect x="-32" y="-104" width="4" height="10" rx="2" fill="#FF2BD6" fill-opacity=".8"/>
            <rect x="28" y="-104" width="4" height="10" rx="2" fill="#FF2BD6" fill-opacity=".8"/>
            <!-- antena -->
            <path d="M0 -124V-138" stroke="#00E5FF" stroke-width="2"/>
            <circle cx="0" cy="-141" r="4.5" fill="#FF2BD6" class="pulse" filter="url(#g)"/>
            <!-- braço da frente (acena) -->
            <g class="limb armR"><rect x="25" y="-74" width="6" height="28" rx="3" fill="#2E3E5A" stroke="#00E5FF" stroke-opacity=".7"/><circle cx="28" cy="-45" r="4.5" fill="#00E5FF"/></g>
            <!-- balão de fala -->
            <g class="bubble">
              <rect x="44" y="-150" width="222" height="40" rx="10" fill="#0A1120" stroke="#FF2BD6" stroke-opacity=".8"/>
              <path d="M52 -110l-10 12 22-12z" fill="#0A1120" stroke="#FF2BD6" stroke-opacity=".8"/>
              <path d="M53 -111h12" stroke="#0A1120" stroke-width="3"/>
              <text x="58" y="-125" font-size="13" fill="#E6EDF3">olá, humano. <tspan fill="#00E5FF">vibe on</tspan><tspan fill="#00E5FF" class="blinkc">_</tspan></text>
            </g>
          </g>
          <g class="limb legA"><rect x="-11" y="-34" width="7" height="30" rx="3.5" fill="#2E3E5A"/><rect x="-14" y="-6" width="15" height="6" rx="3" fill="#00E5FF"/></g>
        </g>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="189" rx="16" fill="none" stroke="#00E5FF" stroke-opacity=".2"/>
</svg>
