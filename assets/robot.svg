    .blink { transform-box: fill-box; transform-origin: center; animation: blink 3.6s infinite; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .eyesN { animation: eyesN 18.0s steps(1) infinite; }
    @keyframes eyesN { 0% { opacity: 1; } 43% { opacity: 0; } 57% { opacity: 1; } }
    .eyesH { opacity: 0; animation: eyesH 18.0s steps(1) infinite; }
    @keyframes eyesH { 0% { opacity: 0; } 43% { opacity: 1; } 57% { opacity: 0; } }
    .bubble { opacity: 0; transform-box: fill-box; transform-origin: 0% 100%; animation: bubble 18.0s ease-out infinite; }
    @keyframes bubble { 0%, 43.5% { opacity: 0; transform: scale(.6); } 45% { opacity: 1; transform: scale(1); } 56% { opacity: 1; transform: scale(1); } 57.5%, 100% { opacity: 0; transform: scale(.6); } }
    .pulse { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .holo { animation: holo 7s steps(1) infinite; }
    @keyframes holo { 0%,96%,100% { opacity: 1; } 97% { opacity: .45; } 98% { opacity: 1; } 99% { opacity: .6; } }
    .blinkc { animation: bc 1s steps(1) infinite; }
    @keyframes bc { 50% { opacity: 0; } }
