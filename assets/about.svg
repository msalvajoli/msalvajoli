<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Sobre mim: Matheus Salvajoli, empreendedor digital, product builder e orquestrador de IA e vibe coder">
  <title>operador.yml // salvajoli</title>
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#00E5FF" stop-opacity=".1"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".6"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="gl" cx="15%" cy="0%" r="60%">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gl2" cx="100%" cy="100%" r="55%">
      <stop offset="0" stop-color="#FF2BD6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#00E5FF" stroke-opacity=".045"/></pattern>
    <filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,'Liberation Mono','Courier New',monospace; }
    .trace { stroke-dasharray: 160 2780; animation: trace 8s linear infinite; }
    @keyframes trace { to { stroke-dashoffset: -2940; } }
    .in { opacity: 0; animation: in .45s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .a1{animation-delay:.2s} .a2{animation-delay:.45s} .a3{animation-delay:.7s} .a4{animation-delay:.95s} .a5{animation-delay:1.2s}
    .b1{animation-delay:.35s} .b2{animation-delay:.6s} .b3{animation-delay:.85s} .b4{animation-delay:1.1s} .b5{animation-delay:1.35s}
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .run { animation: run 5s linear infinite; }
    @keyframes run { from { transform: translateX(0); } to { transform: translateX(431px); } }
    .node { animation: node 5s linear infinite; }
    @keyframes node { 0%,14%,100% { stroke-opacity: .35; fill-opacity: .06; } 4%,8% { stroke-opacity: 1; fill-opacity: .22; } }
    .n1{animation-delay:0s} .n2{animation-delay:1s} .n3{animation-delay:2s} .n4{animation-delay:3s} .n5{animation-delay:4s}
    .knobOn { animation: knobOn .6s cubic-bezier(.2,.8,.2,1) 1.6s both; }
    @keyframes knobOn { from { transform: translateX(-22px); } to { transform: none; } }
    .nope { animation: nope 4s ease-in-out 2.5s infinite; }
    @keyframes nope { 0%,70%,100% { transform: none; } 78% { transform: translateX(12px); } 84% { transform: translateX(-2px); } 88% { transform: none; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- shell -->
  <rect x="8" y="8" width="984" height="524" rx="16" fill="#070B14"/>
  <rect x="8" y="8" width="984" height="524" rx="16" fill="url(#grid)"/>
  <rect x="8" y="8" width="984" height="524" rx="16" fill="url(#gl)"/>
  <rect x="8" y="8" width="984" height="524" rx="16" fill="url(#gl2)"/>
  <rect x="8.5" y="8.5" width="983" height="523" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
  <rect x="8.5" y="8.5" width="983" height="523" rx="16" fill="none" stroke="#00E5FF" stroke-width="2.5" class="trace" filter="url(#g)"/>

  <!-- top bar -->
  <path d="M8 50H992" stroke="#00E5FF" stroke-opacity=".15"/>
  <rect x="24" y="18" width="150" height="24" rx="6" fill="#00E5FF" fill-opacity=".08" stroke="#00E5FF" stroke-opacity=".35"/>
  <text x="99" y="34.5" text-anchor="middle" font-size="12" fill="#7DF9FF" letter-spacing="1">operador.yml</text>
  <text x="196" y="35" font-size="12" fill="#6E7F96" letter-spacing="1">~/perfil/salvajoli</text>
  <circle cx="902" cy="30" r="4" fill="#39FF88" class="pulse"/>
  <text x="966" y="34.5" text-anchor="end" font-size="12" fill="#39FF88" letter-spacing="2">ONLINE</text>

  <path d="M500 74V452" stroke="#00E5FF" stroke-opacity=".12" stroke-dasharray="3 6"/>

  <!-- ══════════ LEFT: identidade ══════════ -->
  <g class="in a1">
    <text x="40" y="86" font-size="12" fill="#00E5FF" letter-spacing="3">// OPERADOR</text>
    <text x="38" y="134" font-size="46" font-weight="800" fill="url(#name)" letter-spacing="3" filter="url(#g)">MATHEUS</text>
  </g>
  <g class="in a2">
    <rect x="40" y="150" width="200" height="28" rx="14" fill="#FF2BD6" fill-opacity=".1" stroke="#FF2BD6" stroke-opacity=".65"/>
    <text x="140" y="168.5" text-anchor="middle" font-size="13" fill="#FF7BE6" letter-spacing="1">codinome · salvajoli</text>
  </g>

  <g class="in a3" font-size="13" fill="#E6EDF3">
    <text x="40" y="210" font-size="12" fill="#00E5FF" letter-spacing="3">// PAPEL</text>
    <rect x="40" y="222" width="196" height="30" rx="15" fill="#00E5FF" fill-opacity=".08" stroke="#00E5FF" stroke-opacity=".5"/>
    <text x="138" y="241.5" text-anchor="middle">Empreendedor Digital</text>
    <rect x="246" y="222" width="152" height="30" rx="15" fill="#00E5FF" fill-opacity=".08" stroke="#00E5FF" stroke-opacity=".5"/>
    <text x="322" y="241.5" text-anchor="middle">Product Builder</text>
    <rect x="40" y="262" width="182" height="30" rx="15" fill="#FF2BD6" fill-opacity=".08" stroke="#FF2BD6" stroke-opacity=".5"/>
    <text x="131" y="281.5" text-anchor="middle">Orquestrador de IA</text>
    <rect x="232" y="262" width="120" height="30" rx="15" fill="#39FF88" fill-opacity=".1" stroke="#39FF88" stroke-opacity=".6"/>
    <text x="292" y="281.5" text-anchor="middle" fill="#B9FFD6">Vibe Coder</text>
  </g>

  <g class="in a4">
    <text x="40" y="324" font-size="12" fill="#00E5FF" letter-spacing="3">// BASE · NICHO</text>
    <text x="40" y="348" font-size="14" fill="#C9D1D9">Brasil <tspan fill="#FF2BD6">·</tspan> Desenvolvimento pessoal <tspan fill="#FF2BD6">·</tspan> EdTech</text>
  </g>

  <g class="in a5">
    <rect x="40" y="368" width="430" height="84" rx="10" fill="#FF2BD6" fill-opacity=".05" stroke="#FF2BD6" stroke-opacity=".45"/>
    <rect x="40" y="368" width="4" height="84" rx="2" fill="#FF2BD6"/>
    <text x="60" y="392" font-size="12" fill="#FF2BD6" letter-spacing="3">// MISSÃO</text>
    <text x="60" y="418" font-size="15" fill="#FFFFFF">Transformar ideias em produtos digitais</text>
    <text x="60" y="440" font-size="15" fill="#FFFFFF">úteis, rápidos e memoráveis.</text>
  </g>

  <!-- ══════════ RIGHT: estado atual ══════════ -->
  <g class="in b1" font-size="14">
    <text x="530" y="86" font-size="12" fill="#00E5FF" letter-spacing="3">// CONSTRUINDO</text>
    <text x="530" y="114" fill="#E6EDF3"><tspan fill="#00E5FF">▸ </tspan>ENEM AI</text>
    <text x="960" y="114" text-anchor="end" font-size="11" fill="#FFB300" letter-spacing="1.5">EM DEPLOY</text>
    <text x="530" y="140" fill="#E6EDF3"><tspan fill="#00E5FF">▸ </tspan>O Código da Disciplina</text>
    <text x="960" y="140" text-anchor="end" font-size="11" fill="#39FF88" letter-spacing="1.5">ONLINE</text>
    <text x="530" y="166" fill="#E6EDF3"><tspan fill="#00E5FF">▸ </tspan>Foco Sem Desculpas</text>
    <text x="960" y="166" text-anchor="end" font-size="11" fill="#39FF88" letter-spacing="1.5">ATIVO</text>
  </g>

  <g class="in b2">
    <text x="530" y="210" font-size="12" fill="#00E5FF" letter-spacing="3">// EXPLORANDO</text>
    <text x="530" y="236" font-size="13.5" fill="#C9D1D9">Arquitetura de software <tspan fill="#FF2BD6">·</tspan> Agentes de IA <tspan fill="#FF2BD6">·</tspan> Automação</text>
  </g>

  <g class="in b3">
    <text x="530" y="278" font-size="12" fill="#00E5FF" letter-spacing="3">// MÉTODO</text>
    <rect x="530" y="303" width="431" height="2" fill="url(#pipe)"/>
    <circle cx="530" cy="304" r="4" fill="#FFFFFF" class="run" filter="url(#g)"/>
    <g font-size="12" fill="#E6EDF3" text-anchor="middle">
      <rect x="530" y="290" width="78" height="28" rx="6" fill="#00E5FF" stroke="#00E5FF" class="node n1"/><rect x="530" y="290" width="78" height="28" rx="6" fill="#070B14" fill-opacity=".7"/>
      <text x="569" y="308.5">Planejar</text>
      <rect x="617" y="290" width="92" height="28" rx="6" fill="#00E5FF" stroke="#00E5FF" class="node n2"/><rect x="617" y="290" width="92" height="28" rx="6" fill="#070B14" fill-opacity=".7"/>
      <text x="663" y="308.5">Arquitetar</text>
      <rect x="718" y="290" width="85" height="28" rx="6" fill="#7DF9FF" stroke="#7DF9FF" class="node n3"/><rect x="718" y="290" width="85" height="28" rx="6" fill="#070B14" fill-opacity=".7"/>
      <text x="760.5" y="308.5">Construir</text>
      <rect x="812" y="290" width="70" height="28" rx="6" fill="#FF2BD6" stroke="#FF2BD6" class="node n4"/><rect x="812" y="290" width="70" height="28" rx="6" fill="#070B14" fill-opacity=".7"/>
      <text x="847" y="308.5">Validar</text>
      <rect x="891" y="290" width="70" height="28" rx="6" fill="#FF2BD6" stroke="#FF2BD6" class="node n5"/><rect x="891" y="290" width="70" height="28" rx="6" fill="#070B14" fill-opacity=".7"/>
      <text x="926" y="308.5">Escalar</text>
    </g>
  </g>

  <g class="in b4">
    <text x="530" y="360" font-size="12" fill="#00E5FF" letter-spacing="3">// STATUS</text>
    <!-- online -->
    <text x="530" y="401" font-size="12" fill="#C9D1D9" letter-spacing="1">ONLINE</text>
    <rect x="585" y="386" width="44" height="22" rx="11" fill="#39FF88" fill-opacity=".2" stroke="#39FF88" stroke-opacity=".7"/>
    <circle cx="618" cy="397" r="7" fill="#39FF88" class="knobOn" filter="url(#g)"/>
    <!-- foco -->
    <text x="660" y="401" font-size="12" fill="#C9D1D9" letter-spacing="1">FOCO</text>
    <rect x="700" y="386" width="44" height="22" rx="11" fill="#00E5FF" fill-opacity=".2" stroke="#00E5FF" stroke-opacity=".7"/>
    <circle cx="733" cy="397" r="7" fill="#00E5FF" class="knobOn" filter="url(#g)"/>
    <!-- desculpas -->
    <text x="775" y="401" font-size="12" fill="#C9D1D9" letter-spacing="1">DESCULPAS</text>
    <rect x="860" y="386" width="44" height="22" rx="11" fill="#1A2233" stroke="#FF4D6D" stroke-opacity=".7"/>
    <circle cx="871" cy="397" r="7" fill="#FF4D6D" class="nope"/>
    <text x="912" y="401" font-size="11" fill="#FF4D6D" letter-spacing="1">false</text>
    <text x="530" y="438" font-size="12" fill="#6E7F96"># regra da casa: <tspan fill="#FF7BE6">sem desculpas, só execução</tspan><tspan fill="#00E5FF" class="blink">_</tspan></text>
  </g>

  <!-- footer -->
  <g class="in b5">
    <path d="M40 476H960" stroke="#00E5FF" stroke-opacity=".15"/>
    <text x="40" y="506" font-size="12" fill="#6E7F96" letter-spacing="2">PADRÃO DE QUALIDADE</text>
    <text x="960" y="506" text-anchor="end" font-size="13" fill="#E6EDF3" letter-spacing="3">APPLE <tspan fill="#FF2BD6">·</tspan> LINEAR <tspan fill="#FF2BD6">·</tspan> STRIPE</text>
  </g>
</svg>
